name: watch_nook
description: "Watchnook — local-first TV & movie tracker."
publish_to: "none"
version: 0.5.2+7

environment:
  sdk: ^3.12.0

# M0 deps only. Later milestones add their own (import/export/stats/notifications,
# patrol E2E, launcher icons, …) in the issue that needs them — see
# .autopilot/plan-m1.md. Front-loading the M0-consumed set here keeps the pubspec
# (and CI dependency resolution) stable across #1–#5.
dependencies:
  archive: ^4.0.9
  cached_network_image: ^3.4.1
  clock: ^1.1.1
  csv: ^8.0.0
  cupertino_icons: ^1.0.8
  drift: ^2.25.0
  drift_flutter: ^0.2.4
  dynamic_color: ^1.7.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.2
  flutter_riverpod: ^3.1.0
  go_router: ^17.1.0
  google_fonts: ^6.2.1
  http: ^1.6.0
  path_provider: ^2.1.5
  riverpod_annotation: ^4.0.0
  # The export hand-off. `file_selector` cannot save a file on Android — its
  # Android implementation only supports openFile/openFiles/getDirectoryPath,
  # so getSaveLocation() throws UnimplementedError there. The share sheet is
  # the working path (see features/settings/data/export_share.dart).
  share_plus: ^12.0.0
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.4.15
  custom_lint: ^0.8.1
  drift_dev: ^2.25.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  # Pinned, not caret-ranged: `patrol test` is driven by patrol_cli, and the two
  # must match. The CLI version is set by THIS repo's own workflow caller —
  # `.github/workflows/e2e.yml` passes `patrol-cli-version` — not by ci-shared,
  # which this repo vendors rather than consumes (see the header of
  # `.github/workflows/flutter-e2e.yml`).
  #
  # patrol 4.9.0 pairs with patrol_cli 4.7.0; keep the two in step against
  # patrol's compatibility table. Since patrol_cli 4.0.0 a mismatch is caught
  # early — the CLI reads the resolved version from `pubspec.lock` and fails
  # fast, rather than the old failure mode of the generated bundle silently
  # ceasing to compile.
  patrol: 4.9.0
  riverpod_generator: ^4.0.0+1
  riverpod_lint: ^3.1.0
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true

  # Fonts are declared under `assets:`, NOT `fonts:` — this is deliberate.
  # `google_fonts` resolves a bundled face by scanning the *asset manifest* for
  # a file whose name ends with `<Family>-<Variant>.ttf`; it never reads the
  # `fonts:` section. `main()` sets `allowRuntimeFetching = false`, so a face
  # that is missing here throws inside the loader, gets swallowed, and the app
  # silently renders Roboto. `test/theme_fonts_test.dart` pins the contract.
  assets:
    - assets/fonts/
    - assets/branding/

# Where patrol_cli installs the instrumented build (#29). Android only — this
# app has no iOS target.
patrol:
  app_name: Watchnook
  # LOAD-BEARING. patrol_cli 4.0.0 changed the DEFAULT test directory from
  # `integration_test` to `patrol_test`; without this key the CLI looks in a
  # directory that does not exist here and discovers zero tests — a silent
  # no-op, not an error. Keeping the old directory avoids churning
  # `.gitignore`, `analysis_options.yaml` and e2e.yml's paths filter + gate.
  test_directory: integration_test
  android:
    package_name: com.stuartbradley.watchnook

# Branded launch/splash screen: the nook glyph centred on Honey/gold, replacing
# the blank template splash. Regenerate after changing the art or colour with:
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#E9BF64"
  image: assets/icon/ic_foreground.png
  android: true
  ios: false
  web: false
  android_12:
    color: "#E9BF64"
    image: assets/icon/ic_foreground.png
