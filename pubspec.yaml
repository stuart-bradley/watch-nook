name: watch_nook
description: "Watchnook — local-first TV & movie tracker."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.0

# M0 deps only. Later milestones add their own (import/export/stats/notifications,
# patrol E2E, launcher icons, …) in the issue that needs them — see
# .autopilot/plan-m1.md. Front-loading the M0-consumed set here keeps the pubspec
# (and CI dependency resolution) stable across #1–#5.
dependencies:
  clock: ^1.1.1
  cupertino_icons: ^1.0.8
  drift: ^2.25.0
  drift_flutter: ^0.2.4
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.1.0
  go_router: ^17.1.0
  google_fonts: ^6.2.1
  http: ^1.6.0
  path_provider: ^2.1.5
  riverpod_annotation: ^4.0.0
  shared_preferences: ^2.3.0

dev_dependencies:
  build_runner: ^2.4.15
  custom_lint: ^0.8.1
  drift_dev: ^2.25.0
  flutter_test:
    sdk: flutter
  riverpod_generator: ^4.0.0+1
  riverpod_lint: ^3.1.0
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true
