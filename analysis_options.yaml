include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    # Delivered design-system reference (a standalone mini-project, its own lint
    # posture). #4 lifts the theme files from here into lib/core/theme/ — those
    # copies ARE analyzed; the originals stay reference-only.
    - "docs/**"
    # Regenerated by build_runner (drift + riverpod) — never committed.
    - "**/*.g.dart"
    # Patrol E2E bundle, regenerated by `patrol test` (never committed; lands M3).
    - "integration_test/test_bundle.dart"
    - "patrol_test/**"
  errors:
    # Riverpod code-gen providers confuse this lint.
    unreachable_from_main: ignore
    # We use public named params that initialise private fields.
    prefer_initializing_formals: ignore

linter:
  rules:
    # This is an app, not a published package — don't require doc comments on
    # every public widget/member.
    public_member_api_docs: false
