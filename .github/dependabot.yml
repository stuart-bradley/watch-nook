version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 30
    groups:
      all:
        patterns:
          - "*"
    # Kept but now INERT: this repo no longer references ci-shared at all (its
    # workflows are vendored in-tree — see the header on .github/workflows/
    # flutter-*.yml and #75). The rule costs nothing and guards against a
    # re-introduced reference erroring the whole github-actions job, since
    # Dependabot cannot read a private repo from a user account.
    #
    # Dependabot now bumps the pinned action SHAs inside the vendored workflows
    # directly. That is deliberate — it keeps the pins current at the cost of
    # drifting from ci-shared, which is the right trade for a fork we intend to
    # keep. When re-syncing, diff ignoring the pinned-SHA lines.
    ignore:
      - dependency-name: stuart-bradley/ci-shared/*

  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 30
    groups:
      all:
        patterns:
          - "*"

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    cooldown:
      default-days: 30
    groups:
      all:
        patterns:
          - "*"
