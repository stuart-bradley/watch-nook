version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 30
    groups:
      all:
        patterns:
          - "*"
    # This repo consumes ci-shared again (#94 deleted the vendored fork), so the
    # rule is LIVE, not inert — ci.yml, e2e.yml and release.yml all reference
    # stuart-bradley/ci-shared/...@v1.
    #
    # Keep ignoring it. `@v1` is a MOVING tag that ci-shared force-pushes: a
    # Dependabot PR pinning it to a SHA would silently opt this repo out of every
    # future shared fix, which is the entire point of consuming the tag. The
    # action SHAs *inside* those workflows are ci-shared's own Dependabot's job.
    #
    # (The old reason — "ci-shared is private and Dependabot can't read it" —
    # no longer applies; it is public now. The rule stays for the reason above.)
    ignore:
      - dependency-name: stuart-bradley/ci-shared/*

  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 30
    groups:
      all:
        patterns:
          - "*"

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    cooldown:
      default-days: 30
    groups:
      all:
        patterns:
          - "*"
