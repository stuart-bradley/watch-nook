name: Release APK

# Tagging `vX.Y.Z` builds a signed universal APK (with the baked TMDB key) and
# attaches it to the GitHub Release. Watchnook ships free via GitHub Releases —
# no Play Store. All the work lives in the reusable ci-shared workflow; this is
# a thin caller. Needs the app's 6 secrets (see the workflow's contract):
# KEYSTORE_BASE64, STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD, TMDB_API_KEY,
# TMDB_READ_TOKEN.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  release-apk:
    # The reusable workflow creates/updates the GitHub Release + uploads the APK.
    permissions:
      contents: write
    uses: stuart-bradley/ci-shared/.github/workflows/flutter-release-apk.yml@v1
    with:
      # Pin Flutter: an unpinned stable auto-updated on the runner and its Gradle
      # plugin broke the Android release build. 3.44.0 is the last known-good;
      # keep ci/e2e/release on the same version.
      flutter-version: "3.44.0"
    secrets: inherit
