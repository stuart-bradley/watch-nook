name: E2E

# PR-only: the PR run already tests the merge result for an up-to-date branch,
# and E2E is the most expensive job (emulator + instrumented build), so it does
# not also run on push to main.
on:
  pull_request:
    branches: [main]
    paths:
      - "lib/**"
      - "integration_test/**"
      - "pubspec.*"
      - ".github/**"
      - "android/**"
      - "justfile"
      - "scripts/**"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Skip E2E until integration tests exist (they land in M3). NOTE: hashFiles() is INVALID in a job-level
  # `if:` — it needs a checked-out workspace, which does not exist when GitHub evaluates job-`if`
  # server-side, so GitHub rejects the whole file as a 0s startup_failure. Detect the tests in a cheap
  # gate job and gate the expensive reusable-workflow job on its output instead.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@v7
      # `find`, NOT `compgen -G 'integration_test/**/*_test.dart'`. Bash's
      # globstar is OFF by default, so `**` collapses to a single `*` and that
      # pattern only matches a test in a SUBDIRECTORY. This repo's test is
      # integration_test/import_flow_test.dart — top level — so the gate
      # silently resolved run=false and E2E was SKIPPED on every run from the
      # day the tests landed. It looked like a deliberate skip, not a bug.
      #
      # This gate has now served its purpose (the tests exist); it can be
      # deleted whenever someone wants one less job per run.
      - id: detect
        run: |
          if [ -n "$(find integration_test -name '*_test.dart' -print -quit 2>/dev/null)" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
  e2e:
    needs: gate
    if: ${{ needs.gate.outputs.run == 'true' }}
    # API 33 (Android 13) for the POST_NOTIFICATIONS runtime dialog; 4G for
    # patrol's heavier instrumented build; install-patrol activates patrol_cli
    # (matches patrol).
    #
    # timeout-minutes 45 is NOT retry headroom -- that machinery was deleted
    # (it fired 0 times in 98 runs and could never help a runner death). It is
    # now load-bearing against emulator-timeout-minutes below: the STEP ceiling
    # must fire before the JOB ceiling, because only a step timeout fails the
    # step and keeps the log. A job killed by timeout-minutes reports
    # conclusion=cancelled and retains nothing.
    uses: ./.github/workflows/flutter-e2e.yml
    with:
      api-level: 33
      disk-size: "4G"
      # MUST stay a literal boolean. As an expression it would arrive as the
      # string "false", which is truthy, so the workflow's
      # `if: !inputs.install-patrol` would stop skipping the warm build.
      install-patrol: true
      # Must match the `patrol` package pin in pubspec.yaml. patrol's
      # compatibility table pairs patrol_cli 4.7.0+ with patrol 4.9.0+ (min
      # Flutter 3.32.0); bump the two together. Set HERE, in watch-nook's own
      # caller, rather than in the vendored flutter-e2e.yml — this file is
      # never re-synced from ci-shared, so the version cannot be clobbered.
      patrol-cli-version: "4.7.0"
      # 35, not the default 12: install-patrol skips the warm build, so the
      # ENTIRE build runs inside the emulator step.
      #
      # VALIDATED UNDER PATROL 3.x, and that qualifier is the point. This was
      # "copied from well-quill and UNVALIDATED, the job has been skipped on
      # every run it ever had" — true until the #79 gate glob bug was fixed in
      # #80. Since then the job actually runs, and 5 measured passes span
      # 8m09s-12m24s (31364735296 / 31367051052 / 31368830363 / 31769504440 /
      # 32446321904), comfortably inside 35.
      #
      # All five predate the patrol 3.20.0 -> 4.9.0 bump, so they do NOT bound
      # the current toolchain. Append a 4.x run ID here once one is green, and
      # raise the ceiling if 4.x builds land materially slower.
      emulator-timeout-minutes: 35
      timeout-minutes: 45
      # Pin Flutter: an unpinned stable auto-updated on the runner and its Gradle
      # plugin broke the patrol Android build ("compileFlutterBuildDebug not
      # found"). 3.44.0 is the last known-good (builds the test bundle); unpin
      # when stable recovers (keep ci/e2e/release on the same version).
      flutter-version: "3.44.0"
