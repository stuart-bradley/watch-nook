# VENDORED from stuart-bradley/ci-shared @21a80c7 — DO NOT EDIT CASUALLY.
#
# watch-nook is a PUBLIC repo and ci-shared is PRIVATE with access_level "user",
# which GitHub documents as sharing "across user owned private repositories
# only". A public caller therefore cannot resolve those reusable workflows: every
# run since 2026-08-07 07:55 was a startup_failure with 0 jobs and no log (#75).
# Vendoring removes the cross-repo reference entirely.
#
# This is a genuine FORK — the other three apps still consume the shared copy.
# Re-sync by hand when ci-shared changes, and expect Dependabot to bump the
# pinned SHAs here and there independently, so diff ignoring those lines.
name: Flutter E2E

# Reusable Android-emulator E2E job. Callers keep their own trigger + paths +
# concurrency, and gate this behind their `check` job with `needs:`.
#
# TWO SHAPES, picked by `install-patrol`:
#
#   plain Flutter (cog-scroll, tasks-on-time) -- build BEFORE the emulator boots,
#     unthrottled, then a small throttled residual inside the emulator window.
#   patrol (well-quill, watch-nook) -- NO warm build; the whole build runs
#     throttled inside the emulator window.
#
# The patrol carve-out is measured, not defensive. well-quill run 31195967334:
# `patrol build android` succeeded in 5m21s, the emulator booted, and then
# `patrol test` logged `• Building apk with entrypoint test_bundle.dart...` and
# rebuilt from scratch anyway -- starving QEMU two minutes later and killing the
# runner. So for patrol the warm build buys nothing AND leaves a Gradle daemon
# holding -Xmx8G alongside a live QEMU on a 4-vCPU box. Skipping it restores the
# pre-reorder arrangement, which ran 19 successes / 1 timeout in 30 days.
#
# The earlier claim here that the warm build was reused at "32% of a cold build"
# on well-quill came from a LOCAL measurement, where both halves share one hot
# Gradle daemon. That does not survive contact with CI, where they are separate
# workflow steps. A local incremental-build number does not predict CI reuse.
#
# THE STEP ORDER IS THE POINT (for plain Flutter): the app is built BEFORE the
# emulator boots.
#
# The build is nearly all of this job — assembleDebug measured 663.3 s on a
# passing cog-scroll run whose tests then took 3 s. Running it next to an
# already-booted emulator starves QEMU on a 4-vCPU runner:
#
#   ERROR | detected a hanging thread 'QEMU2 main loop'. No response for 15594 ms
#   ##[error]The runner has received a shutdown signal.
#
# That is one of two failure modes with the same cause. The other is the job
# clock: assembleDebug overruns `timeout-minutes` and the job is killed having
# produced nothing. Over the 30 days to 2026-08-06 that was 15 of 98 runs — 5
# runner deaths plus 10 timeouts costing 265 min. The timeouts hid for a while,
# because a timed-out job reports `conclusion: cancelled` and keeps NO
# downloadable log; the only trace is the check-run annotation "The job has
# exceeded the maximum execution time of 20m0s". Grep the annotation, not the
# log, when auditing this job.
#
# Building first collapses the emulator's live window from ~19 min to a
# measured 6.2 min (2.4 boot/AVD + ~2 residual Gradle + 1.7 tests) and lets the
# build use the whole runner.
#
# It is NOT sufficient on its own. A residual assembleDebug still runs inside
# the emulator window, and on the heaviest app that alone re-created the
# starvation (tasks-on-time 31176188909). Hence the throttle step further down:
# unthrottled where the build owns the runner, throttled where it shares it
# with QEMU. Both halves are load-bearing -- do not delete either.
#
# For the plain-Flutter apps `just e2e-build` is not extra work: `just e2e` runs
# the same Gradle task and finds it largely up to date. Hold it to the CI
# numbers, not the local ones — the residual assembleDebug measures ~2.9 min on
# CI against 56 s locally.
#
# There is deliberately NO retry-on-infra-crash any more. The previous
# classify/retry/gate trio fired 0 times in those 98 runs and could not have
# helped the 5 deaths — when the runner dies, no later step executes at all. Its
# signatures were also wrong: `TimeoutException` is what a REAL E2E failure looks
# like, and `Failed to find ColorBuffer` appears in PASSING runs. Deleting it
# also lets the emulator step drop `continue-on-error`, which is what made
# `gh run view --log-failed` return nothing (continue-on-error reports the step's
# conclusion as success, so GitHub recorded no failed step). Re-run by hand on
# the rare runner death: `gh run rerun --failed`.
on:
  workflow_call:
    inputs:
      api-level:
        description: "Android API level for the emulator"
        type: number
        default: 31
      disk-size:
        description: "Emulator data partition size (e.g. '2G', '4G')"
        type: string
        default: "2G"
      install-patrol:
        # ALSO skips the warm build (see the `Build the app under test` step).
        # MUST be passed as a literal `true`/`false` by callers, never as an
        # expression: a `${{ … }}` result arrives as the STRING "false", which is
        # truthy, so `!inputs.install-patrol` would be false and the warm build
        # would silently come back for a patrol app.
        description: "Patrol app: activate patrol_cli 3.11.0 and skip the warm build"
        type: boolean
        default: false
      emulator-timeout-minutes:
        # Ceiling for the emulator step alone. 12 suits the plain-Flutter apps,
        # where only a small residual Gradle run happens inside the emulator
        # window. Patrol apps build ENTIRELY inside it (install-patrol skips the
        # warm build) and must pass 35: the worst pre-reorder emulator step
        # measured 22m30s on well-quill run 30616348536 — size against that tail,
        # not the ~19m mean, or the occasional slow run gets clipped.
        #
        # LOAD-BEARING INVARIANT: this ceiling + ~5 min of setup/teardown must
        # stay UNDER the caller's `timeout-minutes`. A job killed by
        # `timeout-minutes` reports conclusion=cancelled and retains NOTHING,
        # so the job ceiling must never be what fires. Measured worst case at
        # 35: 3m51s pre-steps + 35m + 1m11s post (a 4G AVD save is not free) =
        # 40m18s against a 45m job ceiling. Raising one requires raising the
        # other, in every patrol caller.
        #
        # DO NOT rely on this step ceiling alone. It does NOT reliably fire on
        # the emulator-runner step: on well-quill 31250470722 the step carried
        # 35 and ran ~51 minutes without completing, and the JOB ceiling killed
        # it -- losing the log. That is why the script itself is wrapped in
        # `timeout` (see the emulator step). Belt and braces, deliberately.
        description: "Ceiling for the emulator step (patrol apps build inside it — pass 35)"
        type: number
        default: 12
      timeout-minutes:
        # 30, not 20. Measured on the validation run (tasks-on-time 31158068743,
        # the reorder's first real run): 18m0s total — 9.2m build + 6.2m
        # emulator + ~2m setup — with NO Gradle cache and an AVD cache miss,
        # i.e. close to worst case. Two minutes of headroom against a 20m
        # ceiling is not enough, and that ceiling is exactly what produced 10
        # killed jobs and 265 wasted minutes in the 30 days to 2026-08-06. The
        # reorder buys reliability (emulator exposure 19m -> 6.2m) but only a
        # couple of minutes of wall clock, because the build costs the same
        # either way — so the ceiling has to move too. This only bills when a
        # job genuinely hangs.
        description: "Job timeout (ceiling; only bills when a job hangs)"
        type: number
        default: 30
      flutter-version:
        description: "Exact Flutter version, overriding the shared pin in setup-flutter (empty = use the pin)"
        type: string
        default: ""

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Reclaim runner disk first — emulator + build are disk-hungry and
      # the runner image's free space shrinks between image versions.
      - uses: ./.github/actions/free-disk-space

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ inputs.flutter-version }}
          # This job only ever runs on pull_request, so anything it saved landed
          # on refs/pull/N/merge where no other PR could read it — 5.4 GB of
          # tasks-on-time's 8.1 GB budget, evicting the caches that do work. It
          # still RESTORES; it just stops writing. See the cache steps in
          # setup-flutter for the measurements.
          save-gradle-cache: false

      - name: Install patrol_cli
        if: inputs.install-patrol
        run: |
          dart pub global activate patrol_cli 3.11.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      # setup-flutter does not run codegen; E2E has no `just check`, so the
      # aggregated test build needs generated code generated explicitly here.
      - name: Generate code
        run: just codegen

      # Build the app BEFORE the emulator exists — the whole point of this job's
      # ordering (see the header). The app owns the command via `just e2e-build`
      # because the plain-Flutter apps pin `--target-platform android-x64` to
      # match the single ABI `flutter test` builds for the emulator.
      #
      # PATROL APPS SKIP THIS ENTIRELY. `patrol test` rebuilds from scratch
      # regardless (well-quill run 31195967334), so the warm build bought 0 and
      # cost 5m21s — and left a Gradle daemon holding -Xmx8G next to a live QEMU,
      # which is what killed that runner. See the header.
      - name: Build the app under test
        if: ${{ !inputs.install-patrol }}
        # Step-level ceiling, well under the job's. A job killed by
        # `timeout-minutes` reports conclusion=cancelled and keeps NO
        # downloadable log, so a hang here is undiagnosable after the fact --
        # which is exactly what happened three times on 2026-08-07 (#18). A
        # step timeout fails the STEP instead, so the job completes, the log is
        # retained, and the next person can see where it stuck. Measured
        # 8.0-10.4m across the apps, so 15 is generous headroom, not a target.
        timeout-minutes: 15
        run: just e2e-build

      # Enable KVM so the emulator is hardware-accelerated (else it times out).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Throttle Gradle for whatever still builds inside the emulator window.
      # For the plain-Flutter apps that is the RESIDUAL only -- `just e2e-build`
      # above already ran unthrottled with the whole runner to itself. For patrol
      # apps, which skip that step, it is the WHOLE build. Unconditional either
      # way: the rule is "throttle anything that shares the runner with QEMU".
      #
      # This step used to exist, throttling the whole build; #16 deleted it on
      # the reasoning that the build now finishes before the emulator starts.
      # That was wrong, and tasks-on-time 31176188909 is the proof -- the
      # emulator booted, `flutter test` re-entered assembleDebug, and five
      # minutes later:
      #
      #   ERROR | detected a hanging thread 'QEMU2 CPU0 thread'. No response for 15252 ms
      #   ERROR | detected a hanging thread 'QEMU2 main loop'. No response for 15642 ms
      #   ##[error]The runner has received a shutdown signal.
      #
      # i.e. the exact starvation the reorder was supposed to remove. The
      # residual is unavoidable for the plain-Flutter apps: `flutter test
      # integration_test/...` writes a fresh /tmp/flutter_test_listener.XXXX
      # entrypoint per invocation and `targetPath` is a Gradle @Input, so
      # compileFlutterBuildDebug can never be UP-TO-DATE. (Patrol apps reuse
      # better -- `patrol build android` and `patrol test` share the stable
      # -Ptarget=integration_test/test_bundle.dart.)
      #
      # So: unthrottled where it is the only workload, throttled where it shares
      # a 4-vCPU runner with QEMU. ~/.gradle/gradle.properties overrides the
      # app's android/gradle.properties.
      - name: Constrain Gradle inside the emulator window
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.workers.max=3" >> ~/.gradle/gradle.properties

      - name: Cache AVD
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api${{ inputs.api-level }}-x86_64-${{ inputs.disk-size }}-emu11237101-${{ runner.os }}

      # Single emulator boot. Cold boot (-no-snapshot-load -no-snapshot-save): no
      # RAM snapshot is saved/cached, so a run can't hit "cannot load snapshot:
      # default_boot" from emulator-version drift across runs.
      # force-avd-creation: false reuses the cached AVD on a hit, creates it on a
      # miss (the post-job Cache AVD step saves only when the JOB passes).
      - name: Run E2E tests
        # See the build step: a step ceiling keeps the log when this hangs, and
        # it MUST fire before the job ceiling -- only the step timeout preserves
        # diagnostics. See the input's comment for the sizing and the invariant.
        #
        # Default 12 (plain Flutter): measured 4.5-8.0m (AVD hit vs miss), and
        # build 15 + emulator 12 + ~3 setup fits inside the 30m job default.
        # Patrol callers pass 35, against a 45m job ceiling.
        timeout-minutes: ${{ inputs.emulator-timeout-minutes }}
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: ${{ inputs.api-level }}
          # Pin emulator 33.1.24.0 (build 11237101). Recent builds (36.x) hit
          # "Failed to find ColorBuffer" fatally on ~every headless run; the
          # documented fix is this downgrade (#64 bucket A).
          emulator-build: "11237101"
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-boot-timeout: 600
          disk-size: ${{ inputs.disk-size }}
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          # MUST be ONE line: the emulator-runner runs `script` one line per
          # `sh -c`, so a multi-line block loses state across shells and splits
          # `if/fi` (`sh: Syntax error ... expecting "fi"`, exit 2) even when all
          # tests pass. No pipe either (pipefail/PIPESTATUS aren't portable; a
          # mis-read exit could mask a real failure).
          #
          # Output is captured to a FILE, not streamed to the Actions log.
          #
          # HONEST STATUS: this does NOT fix the patrol QEMU runner deaths, and
          # an earlier version of this comment claimed it did. Run 31252986313
          # ran with this redirect AND the timeout bound below and still died
          # (`hanging thread 'QEMU2 ...'` -> `runner has received a shutdown
          # signal`, ~10 min into the build). The single passing control
          # (31247153733) was the whole pre-reorder workflow, and one green run
          # is not evidence for a ~4%-base-rate failure. The cause of the patrol
          # deaths is UNRESOLVED -- see #22.
          #
          # The redirect is kept anyway, on narrower grounds: it matches the
          # long-standing pre-#16 arrangement, it costs nothing, and buffering
          # is the cheaper thing to do next to a live QEMU. Do not re-derive a
          # causal claim from it.
          #
          # It CAPTURES ONLY -- it deliberately does not `cat` the file itself.
          # An unbounded in-script `cat` is a real hazard, proven by run
          # 31248007283: the tests finished at 08:43:20 and the dump then
          # streamed for 38 minutes and tripped the 45m JOB ceiling, which
          # retains no log at all. The bounded dump step below replaces it.
          #
          # logcat goes to a file here rather than stdout because the emulator is
          # torn down with this step; a later step cannot call adb.
          #
          # `timeout` IS LOAD-BEARING -- do not drop it on the grounds that the
          # step already has `timeout-minutes`. THE STEP CEILING DOES NOT
          # RELIABLY FIRE ON THIS ACTION. Measured on well-quill 31250470722:
          # `Run E2E tests` carried timeout-minutes 35, ran ~51 minutes without
          # ever completing, and the JOB ceiling (45m) killed it -- retaining NO
          # log, exactly what the step ceiling exists to prevent. Bounding the
          # command guarantees it returns, so the logcat capture and the dump
          # step both run whatever GitHub's step timeout does.
          #
          # 3 minutes under the step ceiling so this fires first, leaving room
          # for the emulator-runner's own teardown.
          script: timeout $(( ${{ inputs.emulator-timeout-minutes }} - 3 ))m just e2e > e2e-output.txt 2>&1; rc=$?; [ "$rc" -eq 0 ] || adb logcat -d -t 2000 > e2e-logcat.txt 2>&1; exit "$rc"

      # THE OTHER HALF OF THE REDIRECT. Restoring the redirect without this is a
      # regression, not a fix: `just e2e` writes to a file and prints nothing, so
      # if nothing dumps the file the step log is EMPTY.
      #
      # It must be a separate `if: always()` step rather than a trailing command
      # in the script above. When `timeout-minutes` fires, the runner SIGKILLs
      # the emulator step's process group, so anything appended to that one-liner
      # never executes -- but `always()` steps still run. A hang is the failure
      # mode this job is built around (10 timed-out jobs in 98 runs), and #19
      # added the step ceilings specifically so "a hang keeps its log"; without
      # this step that guarantee is silently void, and worst for the patrol apps,
      # whose entire 35-minute build+test window would go dark.
      #
      # The redirect writes incrementally, so the file holds everything up to the
      # hang. Dumping here cannot re-create the streaming contention the redirect
      # exists to avoid, because the emulator is already gone by this point.
      - name: Dump E2E diagnostics
        if: always()
        run: |
          tail -c 2000000 e2e-output.txt || true
          if [ -s e2e-logcat.txt ]; then
            echo '--- logcat (last 2000 lines) ---'
            cat e2e-logcat.txt
          fi
