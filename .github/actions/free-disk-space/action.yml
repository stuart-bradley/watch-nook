name: Free disk space
description: >
  Remove unused preinstalled toolchains (dotnet, Android NDK, GHC, PowerShell,
  Swift) to give the Android/Gradle build headroom on the runner image, whose
  baseline free disk periodically shrinks and fails builds with "No space left
  on device". Prints `df -h /` for observability. Run this first — before
  setup-flutter and any build — so every downstream step has the headroom.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
          /opt/ghc /usr/local/share/powershell /usr/share/swift \
          /usr/local/.ghcup 2>/dev/null || true
        sudo apt-get clean 2>/dev/null || true
        df -h /
